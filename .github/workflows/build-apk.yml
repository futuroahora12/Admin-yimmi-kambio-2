name: Build APK Yimmi Kambio Admin

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Ensure www/index.html exists
        run: |
          mkdir -p www
          if [ ! -f "www/index.html" ] && [ -f "index.html" ]; then
            cp index.html www/index.html
          fi

      - name: Install dependencies and prepare Android platform
        run: |
          npm ci || npm install
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Yimmi Kambio app icons from logo
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil
          curl -sSL "https://i.postimg.cc/t4fJptrQ/BCV-20261120-041842-0000.png" -o /tmp/yimmi_logo.png
          python3 - << 'EOF'
          from PIL import Image
          import os

          src = Image.open("/tmp/yimmi_logo.png").convert("RGBA")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          res_dir = "android/app/src/main/res"
          for folder, px in sizes.items():
              out_dir = os.path.join(res_dir, folder)
              os.makedirs(out_dir, exist_ok=True)
              icon = src.resize((px, px), Image.Resampling.LANCZOS)
              icon.save(os.path.join(out_dir, "ic_launcher.png"))
              icon.save(os.path.join(out_dir, "ic_launcher_round.png"))
              icon.save(os.path.join(out_dir, "ic_launcher_foreground.png"))
          EOF

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yimmi-Kambio-Admin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
